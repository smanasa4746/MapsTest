<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mauze Navigation Guide</title>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0a58ff; --secondary: #4ca1ff; --text-dark: #19324a; }
        body { margin: 0; padding: 20px; font-family: 'Poppins', sans-serif; background: #f0f4f8; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; }
        h2 { text-align: center; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
        .select-area { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .directory-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: none; }
        .card-header { background: #f8faff; padding: 20px; border-bottom: 1px solid #eee; }
        .mauze-title { margin: 0; color: var(--primary); font-size: 24px; }
        .jamiat-tag { font-size: 14px; color: #666; text-transform: uppercase; }
        .card-body { padding: 25px; }
        .info-row { margin-bottom: 12px; display: flex; flex-wrap: wrap; border-bottom: 1px solid #f1f1f1; padding-bottom: 8px; }
        .info-label { font-weight: 700; color: var(--text-dark); width: 180px; }
        .info-value { flex: 1; color: #444; }
        .btn { display: block; width: 100%; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; text-align: center; margin-top: 10px; border: none; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-suggest { background: #fff3cd; color: #856404; margin-top: 20px; }
        .section-title { margin: 20px 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--secondary); font-weight: 700; color: var(--primary); }
    </style>
</head>

<body>
    <div class="container">
        <h2>Mauze Navigation Guide</h2>

        <div class="select-area">
            <select id="mauzeDropdown" style="width:100%;">
                <option value="">Loading data...</option>
            </select>
        </div>

        <div id="resultCard" class="directory-card">
            <div class="card-header">
                <div class="jamiat-tag" id="jamiatVal"></div>
                <h3 class="mauze-title" id="mauzeNameVal"></h3>
            </div>
            <div class="card-body">
                <div id="ilaqaRow" class="info-row"><span class="info-label">📍 Mauze Ilaqa:</span><span class="info-value" id="ilaqaVal"></span></div>
                <div class="info-row"><span class="info-label">📏 Distance from you:</span><span class="info-value" id="distanceVal">Detecting...</span></div>
                
                <div id="mapHolder" style="margin:20px 0; border-radius:12px; overflow:hidden;"></div>
                <div id="preciseBtnRow"></div>

                <div id="railwaySection" style="display:none;">
                    <div class="section-title">🚆 Railway Details</div>
                    <div id="rwNameRow" class="info-row"><span class="info-label">Station Name:</span><span class="info-value" id="rwName"></span></div>
                    <div id="rwLineRow" class="info-row"><span class="info-label">Railway Line:</span><span class="info-value" id="rwLine"></span></div>
                    <div id="rwCodeRow" class="info-row"><span class="info-label">Station Code:</span><span class="info-value" id="rwCode"></span></div>
                    <div id="rwNearRow" class="info-row"><span class="info-label">Nearby Station:</span><span class="info-value" id="rwNear"></span></div>
                </div>

                <div id="airportSection" style="display:none;">
                    <div class="section-title">✈️ Airport Details</div>
                    <div id="apNameRow" class="info-row"><span class="info-label">Airport Name:</span><span class="info-value" id="apName"></span></div>
                    <div id="apTypeRow" class="info-row"><span class="info-label">Type:</span><span class="info-value" id="apType"></span></div>
                    <div id="apCodeRow" class="info-row"><span class="info-label">Airport Code:</span><span class="info-value" id="apCode"></span></div>
                </div>

                <button class="btn btn-suggest" onclick="suggestEdit()">Suggest Edits / Changes</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        // Updated URL format for better compatibility
        const GOOGLE_API_KEY = "AIzaSyAkSyCN2lCcEwtrzY-G0FeCsSsr19xd-9E";
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQo0jofOYG07uWWttgjj9IaJJALlVJ53Fwswssg7umlct27w-A9qG0JaTWMaXmth6jm--m4gYr0vA9_/pub?gid=0&single=true&output=csv";

        let sheetData = [];

        $(document).ready(function() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                // This function cleans your headers so "Mauze Name " becomes "mauzename"
                transformHeader: h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, ""),
                complete: function(results) {
                    sheetData = results.data;
                    console.log("Data Loaded:", sheetData[0]); // Debugging line
                    setupDropdown();
                },
                error: function(err) {
                    console.error("Error loading CSV:", err);
                    alert("Could not load data. Check console for details.");
                }
            });
        });

        function setupDropdown() {
            const dropdown = $("#mauzeDropdown");
            dropdown.empty().append('<option value="">Search Mauze</option>');

            // Sort by Jamiat
            sheetData.sort((a, b) => (a.jamiat || "").localeCompare(b.jamiat || ""));

            sheetData.forEach((r, index) => {
                const mName = r.mauzename; // Matches cleaned header "Mauze Name "
                const jName = r.jamiat;
                if (mName) {
                    dropdown.append(new Option(`${jName} - ${mName}`, index));
                }
            });

            dropdown.select2().on('select2:open', () => {
                setTimeout(() => { document.querySelector('.select2-search__field').focus(); }, 10);
            });
        }

        $("#mauzeDropdown").on("change", function() {
            const idx = $(this).val();
            if (!idx) { $("#resultCard").hide(); return; }
            
            const row = sheetData[idx];
            $("#resultCard").fadeIn();

            // Display Logic (using cleaned keys)
            $("#mauzeNameVal").text(row.mauzename);
            $("#jamiatVal").text(row.jamiat);
            
            toggleRow("#ilaqaRow", "#ilaqaVal", row.ilaqa);

            // Map Holder now uses coordinates
            if (row.coordinates) {
                $("#mapHolder")
                    .html(
                        `<iframe 
                            width="100%" 
                            height="250" 
                            frameborder="0" 
                            src="https://www.google.com/maps/embed/v1/place?key=${GOOGLE_API_KEY}&q=${row.coordinates}&zoom=15&maptype=satellite">
                        </iframe>`
                    )
                    .show();
            
                calculateDist(row.coordinates);
            } else {
                $("#mapHolder").hide();
                $("#distanceVal").text("Masjid/Markaz Vicinity not updated for this Mauze.");
            }
            
            
            // Precise Button now uses link
            if (row.link) {
                $("#preciseBtnRow").html(
                    `<a href="${row.link.replace("view", "preview")}" 
                        target="_blank" 
                        class="btn btn-primary">
                        📍 Mauze City Map
                    </a>`
                ).show();
            } else {
                $("#preciseBtnRow").empty().hide();
            }

            // Railway & Airport sections
            const hasRW = row.railwaystationname || row.nearestrailwaystation;
            $("#railwaySection").toggle(!!hasRW);
            toggleRow("#rwNameRow", "#rwName", row.railwaystationname);
            toggleRow("#rwLineRow", "#rwLine", row.railwayline);
            toggleRow("#rwCodeRow", "#rwCode", row.railwaystationcode);
            toggleRow("#rwNearRow", "#rwNear", row.nearestrailwaystation);

            const hasAP = row.airportname;
            $("#airportSection").toggle(!!hasAP);
            toggleRow("#apNameRow", "#apName", row.airportname);
            toggleRow("#apTypeRow", "#apType", row.domesticinternational);
            toggleRow("#apCodeRow", "#apCode", row.airportcode);
        });

        function toggleRow(rowId, valId, val) {
            if (val && val.toString().trim() !== "") {
                $(valId).text(val);
                $(rowId).show();
            } else { $(rowId).hide(); }
        }

        function calculateDist(coords) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    const [lat2, lon2] = coords.split(",").map(c => Number(c.trim()));
                    if (isNaN(lat2) || isNaN(lon2)) return;
                    const R = 6371;
                    const dLat = (lat2 - p.coords.latitude) * Math.PI / 180;
                    const dLon = (lon2 - p.coords.longitude) * Math.PI / 180;
                    const a = Math.sin(dLat/2)**2 + Math.cos(p.coords.latitude * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
                    const d = (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
                    $("#distanceVal").text(d + " km away");
                }, () => $("#distanceVal").text("GPS Permission denied"));
            }
        }

        function suggestEdit() {
            window.location.href = `mailto:gfo@alvazarat.org?subject=Edit Suggestion: ${$("#mauzeNameVal").text()}`;
        }
    </script>
</body>
</html>
